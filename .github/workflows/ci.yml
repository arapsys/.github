# ci.yml: this repository's own checks. `tests` runs the test scripts;
# `pr-check` and `security` run the reusable workflows from the branch under
# change, so a change to the rules is checked by the rules it proposes.
name: ci

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

# pull-requests: write is for pr-check's security-sensitive label, issues:
# read for its workflow-approval rule, and security-events: write for
# security's SARIF upload; a reusable workflow gets no more than its caller
# grants.
permissions:
  contents: read
  issues: read
  pull-requests: write
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/pr-check.test.sh
      - run: bash tests/security.test.sh

  pr-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-check.yml

  # Not on edited events: the scan depends on the code only.
  security:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    uses: ./.github/workflows/security.yml
    with:
      mise-check: false
