# pr-check.yml: a reusable workflow that checks a pull request's title and
# description, and labels changes to security-sensitive paths. A repository
# adopts it with a caller workflow on pull_request_target; see README.md.
#
# It fails a pull request when:
#   - the title is not a Conventional Commit, type(scope): description, or
#     runs over 72 characters;
#   - the description has no "## Checks" section, or a box in it is
#     unticked with no reason on the line below it;
#   - it shows generated content (a commit co-authored by
#     noreply@anthropic.com, or a "Generated with" line in the description)
#     and the "Generated content declared" box is unticked;
#   - it touches a security-sensitive path and the "security-sensitive path"
#     box is unticked;
#   - a workflow it adds or changes filters a trigger with paths: or
#     paths-ignore:. A required check whose workflow doesn't run waits
#     forever, so skipping belongs inside the workflow. The file is fetched
#     at the head commit and parsed with yq, as data, never run;
#   - it changes both a policy path and code. Policy paths are listed in the
#     caller's policy-paths-file (gitignore syntax, read from the base
#     branch); code is any other file under a code-paths prefix. A gate is
#     never changed in the PR it verifies. With no policy file, no rule;
#   - its title type is fix and, under a tests-paths prefix, it removes more
#     assertion or test-attribute lines than it adds, or adds a skip. A
#     commented-out line counts as removed. Read from the files API's
#     patches, as data; a test file with no patch gets a warning;
#   - with workflow-approval-label set, it changes .github/workflows/ and no
#     issue it closes or is part of carries that label. Dependency bots in
#     exempt-authors skip it, as they skip the template rules;
#   - with followups-section set, the description has no section of that
#     name, or a line in it is neither "None" nor a bullet that links an
#     issue (#N), a memory entry the PR adds (memory: <id>) or work for the
#     coordinator to raise (raise: <intent>, which warns until it becomes
#     #N), or a memory entry the PR adds has no memory: bullet. Dependency
#     bots skip it;
#   - with leftovers-section set, and the PR out of draft or labelled
#     reviewed, the description has no section of that name, or it holds
#     only HTML comments, or a placeholder (a line that is one all-caps
#     token such as REVIEW_LEFTOVERS, or starts with TODO or TBD). "None"
#     or any other text passes. A draft without the label gets a warning.
#     Draft state and labels come from the event payload. Dependency bots
#     skip it;
#   - GitHub listed fewer files than the PR changes (the files API stops at
#     3000 without an error), so every rule above saw only part of it;
#   - with max-files set, it changes more files than that.
# With warn-files set, a PR over it (and not over max-files) passes with a
# warning and risk/high.
# It reports size, never failing because of it: added plus deleted lines
# from the PR files API, skipping paths in the caller's size-ignore-file
# (gitignore syntax, read from the base branch). It sets one label, size/S
# (up to 100), size/M (up to 200), size/L (up to 400) or size/XL, writes the
# count to the job summary, and warns at L and XL. The count matches the
# caller's own scripts/pr-size.sh where it has one: the files API diffs
# against the merge base, follows renames and gives binary files 0 lines.
#
# It computes a risk tier, never failing because of it, for the trial in
# arapsys/redd docs/engineering.md section 7.3. The first rule that applies
# decides, and the job summary names it:
#   high    touches a security-sensitive path; touches a Migrations/ folder;
#           or bumps a major version in Directory.Packages.props or the SDK
#           in global.json (read from the files API's patch, as data);
#   low     documentation only (*.md or docs/), size S or M; or a
#           renovate[bot] update of dependency files only, with no major
#           bump in a readable patch, size S or M;
#   medium  everything else.
# It sets one label, risk/high, risk/medium or risk/low. Callers that also
# trigger on labeled and unlabeled get any hand-made change put back: label
# changes by this workflow's token don't start new runs.
#
# It warns, without failing, when the description references no issue:
# no closing keyword (close, fix or resolve with #N, owner/repo#N or an
# issue URL), no "Part of #N" and no "No issue: <reason>" line. A closing
# keyword is what lists the PR under the issue's Development section.
#
# A dependency bot listed in the exempt-authors input (by default
# renovate[bot] and dependabot[bot]) skips the Checks, provenance and issue
# rules, which ask about a template it does not fill in. Its title is still
# checked. Every other author, including any other bot such as an agent's
# GitHub App, is checked in full: an agent's pull request is the one that
# most needs its Checks section.
#
# Security-sensitive paths are listed in gitignore syntax in the calling
# repository's paths-file, read from the base branch, so a pull request
# cannot unprotect itself. A pull request that touches one, by a file's new
# or old name, gets the security-sensitive label, and loses it on a later
# push that no longer does. With no paths-file there is no label.
#
# Nothing from the pull request's head is checked out or run: its title,
# body, commit messages and file names are read as data. PR fields reach
# scripts through env only, never through ${{ }} inside a script. The check
# step is pure (files and env in, verdict out) so tests/pr-check.test.sh
# can extract and run it. The steps before and after it make every API call.
#
# Written for arapsys. It deliberately leaves out the PAP rules in
# blairforce1/.github's pr-checks (Change:, Record:, class:*, Approved-by:,
# risk labels) and borrows only its pull_request_target pattern.

name: pr-check

on:
  workflow_call:
    inputs:
      paths-file:
        description: Security-sensitive path list, gitignore syntax, read from the base branch.
        type: string
        default: .github/security-sensitive-paths
      exempt-authors:
        description: Space-separated logins that skip the template rules (Checks, provenance, issue). Dependency bots only; never an agent's app.
        type: string
        default: renovate[bot] dependabot[bot]
      size-ignore-file:
        description: Paths that don't count toward the size label, gitignore syntax, read from the base branch.
        type: string
        default: .github/pr-size-ignore
      policy-paths-file:
        description: Policy paths that never change in the same pull request as code, gitignore syntax, read from the base branch.
        type: string
        default: .github/policy-paths
      warn-files:
        description: Changed files above which a pull request passes with a warning and risk/high. Empty turns the warning off.
        type: string
        default: ""
      max-files:
        description: Changed files above which a pull request fails. Empty turns the limit off.
        type: string
        default: ""
      code-paths:
        description: Space-separated path prefixes that count as code for the policy rule.
        type: string
        default: src/
      workflow-approval-label:
        description: A label that an issue the pull request closes or is part of must carry when it changes .github/workflows/. Empty turns the rule off.
        type: string
        default: ""
      followups-section:
        description: The heading (without "## ") of the section in which every follow-up and open question must be linked. Empty turns the rule off.
        type: string
        default: ""
      leftovers-section:
        description: The heading (without "## ") of the section that lists review findings left unfixed, or "None". Checked once the pull request is out of draft or labelled reviewed. Empty turns the rule off.
        type: string
        default: ""
      memory-dir:
        description: Where memory entries live, for the followups rule's "memory:" links.
        type: string
        default: docs/project/memory.d/
      tests-paths:
        description: Space-separated path prefixes whose assertions a fix pull request must keep.
        type: string
        default: tests/

# pull-requests: write is for the security-sensitive, size and risk labels
# and nothing else. issues: read is for the workflow-approval rule, which
# reads the labels of the issues a pull request names: in a private
# repository the token can't read an issue without it. The caller must
# grant it too, or the workflow can't start.
# On a pull request from a fork the token stays read-only and the label
# step warns instead.
permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the path lists from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.paths-file }}
            ${{ inputs.size-ignore-file }}
            ${{ inputs.policy-paths-file }}
          sparse-checkout-cone-mode: false

      - name: Read the pull request's commits and files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTS_PATHS: ${{ inputs.tests-paths }}
          BODY: ${{ github.event.pull_request.body }}
          APPROVAL_LABEL: ${{ inputs.workflow-approval-label }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[].commit.message' > "$RUNNER_TEMP/commits.txt"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          # Files the PR adds, for the followups rule's memory: links.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | select(.status == "added") | .filename' > "$RUNNER_TEMP/added.txt"
          # One line per file, under its new name: additions, deletions, path.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | "\(.additions)\t\(.deletions)\t\(.filename)"' > "$RUNNER_TEMP/sizes.tsv"
          # The patches of the files that hold dependency versions, for the
          # major-bump rule. A file whose patch GitHub omits adds nothing.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | select(.filename | test("(^|/)(Directory\\.Packages\\.props|global\\.json)$")) | .patch // empty' \
            > "$RUNNER_TEMP/deps.patch"
          # The patches of test files, for the fix rule: a "=== <path>" line,
          # then the patch, or "=== no-patch <path>" when GitHub omits it.
          # shellcheck disable=SC2016 # $f and $p are jq variables, not shell ones.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename as $f
                  | select(any(env.TESTS_PATHS | split(" ")[] | select(. != ""); . as $p | $f | startswith($p)))
                  | if .patch then "=== \($f)", .patch else "=== no-patch \($f)" end' \
            > "$RUNNER_TEMP/tests.patch"
          # The labels of each issue the description closes or is part of,
          # for the workflow-approval rule, only when it is on. An issue that
          # can't be read gets no labels, so the rule fails rather than passes.
          : > "$RUNNER_TEMP/issue-labels.tsv"
          if [[ -n "$APPROVAL_LABEL" ]]; then
            visible="$(printf '%s\n' "$BODY" | perl -0pe 's/<!--.*?-->//gs')"
            issues="$(grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?|part of)[[:space:]]*:?[[:space:]]+#[0-9]+' <<<"$visible" \
              | grep -Eo '[0-9]+$' | sort -un || true)"
            for n in $issues; do
              labels="$(gh api "repos/$REPO/issues/$n" --jq '[.labels[].name] | join(",")')" || labels=""
              printf '%s\t%s\n' "$n" "$labels" >> "$RUNNER_TEMP/issue-labels.tsv"
            done
          fi
          # How many files the PR changes, by GitHub's own count, to check
          # the files list wasn't cut short (it stops at 3000).
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.changed_files' > "$RUNNER_TEMP/changed-files.txt"
          # The workflows the PR adds or changes, at its head commit, for the
          # trigger-filter rule. Saved as data under numbered names.
          mkdir -p "$RUNNER_TEMP/workflows"
          : > "$RUNNER_TEMP/workflows/index.tsv"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | select(.status != "removed") | select(.filename | test("^\\.github/workflows/[^/]+\\.ya?ml$")) | .filename' \
            > "$RUNNER_TEMP/workflow-files.txt"
          i=0
          while IFS= read -r path; do
            i=$((i + 1))
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPO/contents/$(jq -rn --arg p "$path" '$p | split("/") | map(@uri) | join("/")')?ref=$HEAD_SHA" \
              > "$RUNNER_TEMP/workflows/$i.yml"
            printf '%s\t%s\n' "$i" "$path" >> "$RUNNER_TEMP/workflows/index.tsv"
          done < "$RUNNER_TEMP/workflow-files.txt"

      - name: Check
        id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
          COMMITS_FILE: ${{ runner.temp }}/commits.txt
          FILES_FILE: ${{ runner.temp }}/files.txt
          PATHS_FILE: ${{ inputs.paths-file }}
          SIZE_FILE: ${{ runner.temp }}/sizes.tsv
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.txt
          WARN_FILES: ${{ inputs.warn-files }}
          MAX_FILES: ${{ inputs.max-files }}
          SIZE_IGNORE_FILE: ${{ inputs.size-ignore-file }}
          DEPS_FILE: ${{ runner.temp }}/deps.patch
          WORKFLOWS_DIR: ${{ runner.temp }}/workflows
          POLICY_PATHS_FILE: ${{ inputs.policy-paths-file }}
          CODE_PATHS: ${{ inputs.code-paths }}
          TESTS_PATCH_FILE: ${{ runner.temp }}/tests.patch
          APPROVAL_LABEL: ${{ inputs.workflow-approval-label }}
          ISSUE_LABELS_FILE: ${{ runner.temp }}/issue-labels.tsv
          FOLLOWUPS_SECTION: ${{ inputs.followups-section }}
          MEMORY_DIR: ${{ inputs.memory-dir }}
          ADDED_FILE: ${{ runner.temp }}/added.txt
          LEFTOVERS_SECTION: ${{ inputs.leftovers-section }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          err() { printf '::error title=pr-check::%s\n' "$1"; fail=1; }
          ok() { printf 'ok    %s\n' "$1"; }

          # Title.
          types='feat|fix|docs|style|refactor|perf|test|build|ci|cli|chore|revert'
          re="^($types)(\([a-z0-9._/,-]+\))?!?: [^[:space:]]"
          if [[ "$TITLE" =~ $re ]]; then
            ok "title is a Conventional Commit"
          else
            err "The title is not a Conventional Commit: type(scope): description, with a type from: ${types//|/, }."
          fi
          if (( ${#TITLE} > 72 )); then
            err "The title is ${#TITLE} characters long. Keep it to 72."
          fi

          # Trigger path filters in the workflows the PR adds or changes.
          # Parsed with yq as data. A file yq can't read fails, so a broken
          # file can't hide a filter.
          if [[ -s "${WORKFLOWS_DIR:-}/index.tsv" ]]; then
            filtered=0
            while IFS=$'\t' read -r n path; do
              # shellcheck disable=SC2016 # $event is a yq variable, not a shell one.
              if ! filters="$(yq -r '.on | select(tag == "!!map") | to_entries[]
                  | select(.value | tag == "!!map") | .key as $event | .value | keys[]
                  | select(. == "paths" or . == "paths-ignore") | $event + "." + .' \
                  "$WORKFLOWS_DIR/$n.yml" 2>&1)"; then
                err "$path could not be read as YAML, so its triggers were not checked: $filters"
                filtered=1
              elif [[ -n "$filters" ]]; then
                err "$path filters a trigger by path ($(paste -sd, - <<<"$filters" | sed 's/,/, /g')). A required check whose workflow doesn't run waits forever. Skip jobs inside the workflow instead."
                filtered=1
              fi
            done < "$WORKFLOWS_DIR/index.tsv"
            (( filtered )) || ok "no workflow filters a trigger by path"
          fi

          # A fix keeps its tests: count assertion and test-attribute lines
          # removed and added under the tests paths, and skips added. A
          # comment line counts on neither side, so commenting out an
          # assertion removes it.
          if [[ "$TITLE" =~ ^fix(\([^\)]*\))?!?: ]] && [[ -s "${TESTS_PATCH_FILE:-}" ]]; then
            counts="$(awk '
              /^=== / { next }
              /^[-+]/ {
                sign = substr($0, 1, 1); code = substr($0, 2)
                if (code ~ /^[[:space:]]*(\/\/|\/\*|\*)/) next
                kept = (code ~ /Assert\.|\[(Test|Fact|Theory|TestMethod)[],(]/)
                skip = (code ~ /\[Skip[](]|\[Ignore[](]/)
                if (sign == "-") { r += kept; u += skip } else { a += kept; s += skip }
              }
              END { print r + 0, a + 0, s + 0, u + 0 }' "$TESTS_PATCH_FILE")"
            read -r removed added skipped unskipped <<<"$counts"
            if (( removed > added )); then
              err "This fix removes $removed assertion or test lines under ${TESTS_PATHS-tests/} and adds $added. A fix never removes, loosens or comments out a test. Put them back, or if this isn't a fix, change the title and give the reason in the description."
            elif (( skipped > unskipped )); then
              err "This fix skips $((skipped - unskipped)) more test(s) than it re-enables. A fix never skips a test."
            else
              ok "the fix keeps its tests: $removed assertion or test lines removed, $added added"
            fi
            while IFS= read -r missing; do
              printf '::warning title=pr-check::%s\n' "GitHub gave no diff for ${missing#=== no-patch }, so the fix rule didn't check it."
            done < <(grep '^=== no-patch ' "$TESTS_PATCH_FILE" || true)
          fi

          # Security-sensitive paths, matched with git's own gitignore rules.
          sensitive=false
          if [[ -f "$PATHS_FILE" ]]; then
            scratch="$(mktemp -d)"
            git init -q "$scratch"
            matches="$(git -C "$scratch" -c core.excludesFile="$(realpath "$PATHS_FILE")" \
              check-ignore --no-index --stdin < "$FILES_FILE" || true)"
            if [[ -n "$matches" ]]; then
              sensitive=true
              printf 'Security-sensitive paths touched:\n%s\n' "$matches"
            else
              ok "no security-sensitive path touched"
            fi
          else
            echo "No $PATHS_FILE on the base branch, so no path counts as security-sensitive."
          fi
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          fi

          # Policy and code in separate pull requests. git exits 1 when
          # nothing matches; anything above that is an error, not a pass.
          if [[ -f "${POLICY_PATHS_FILE:-}" ]]; then
            policy_scratch="$(mktemp -d)"
            git init -q "$policy_scratch"
            # Blank lines dropped: git exits 128 on an empty path.
            changed_files="$(grep -v '^$' "$FILES_FILE" || true)"
            policy_rc=0 policy=""
            if [[ -n "$changed_files" ]]; then
              policy="$(git -C "$policy_scratch" -c core.excludesFile="$(realpath "$POLICY_PATHS_FILE")" \
                check-ignore --no-index --stdin <<<"$changed_files")" || policy_rc=$?
            fi
            if (( policy_rc > 1 )); then
              err "Could not match the changed files against $POLICY_PATHS_FILE (git exited $policy_rc)."
            else
              code=""
              read -ra prefixes <<<"${CODE_PATHS-src/}"
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                grep -qxF -- "$path" <<<"$policy" && continue
                for prefix in "${prefixes[@]}"; do
                  if [[ "$path" == "$prefix"* ]]; then code+="$path"$'\n'; break; fi
                done
              done <<<"$changed_files"
              if [[ -n "$policy" && -n "$code" ]]; then
                err "This pull request changes policy ($(head -3 <<<"$policy" | paste -sd, - | sed 's/,/, /g')) and code ($(grep -v '^$' <<<"$code" | head -3 | paste -sd, - | sed 's/,/, /g')). Put the policy change in a pull request of its own: a gate is never changed in the change it verifies."
              elif [[ -n "$policy" ]]; then
                ok "policy changes with no code"
              else
                ok "no policy path touched"
              fi
            fi
          fi

          # File count. sizes.tsv has one line per file, under its new name.
          listed="$(grep -c . "$SIZE_FILE" || true)"
          changed_count="$(tr -dc '0-9' < "${CHANGED_FILES_FILE:-/dev/null}" 2>/dev/null || true)"
          if [[ -z "$changed_count" ]]; then
            err "GitHub's count of changed files couldn't be read, so a cut-short file list can't be ruled out."
            changed_count="$listed"
          elif (( listed < changed_count )); then
            err "GitHub listed $listed of the $changed_count changed files (its files list stops at 3000), so these checks saw only part of the pull request. Split it."
          fi
          many_files=false
          if [[ -n "${MAX_FILES:-}" ]] && (( changed_count > MAX_FILES )); then
            err "This pull request changes $changed_count files, over the limit of $MAX_FILES. Split it into pull requests of ${WARN_FILES:-$MAX_FILES} files or fewer."
          elif [[ -n "${WARN_FILES:-}" ]] && (( changed_count > WARN_FILES )); then
            many_files=true
            printf '::warning title=pr-check::%s\n' "This pull request changes $changed_count files, over $WARN_FILES. Split it unless it is one mechanical change. It is marked risk/high."
          fi

          # Size: report only, never sets fail. Bots get a size too.
          counted=0 skipped=0
          ignored=""
          if [[ -f "$SIZE_IGNORE_FILE" ]]; then
            sizes_scratch="$(mktemp -d)"
            git init -q "$sizes_scratch"
            ignored="$(cut -f3 "$SIZE_FILE" | git -C "$sizes_scratch" \
              -c core.excludesFile="$(realpath "$SIZE_IGNORE_FILE")" \
              check-ignore --no-index --stdin || true)"
          fi
          # || [[ -n "$path" ]] keeps a last line that has no newline.
          while IFS=$'\t' read -r added deleted path || [[ -n "${path:-}" ]]; do
            [[ -n "$path" ]] || continue
            lines=$(( added + deleted ))
            if [[ -n "$ignored" ]] && grep -qxF -- "$path" <<<"$ignored"; then
              skipped=$(( skipped + lines ))
            else
              counted=$(( counted + lines ))
            fi
          done < "$SIZE_FILE"
          if   (( counted <= 100 )); then size=size/S
          elif (( counted <= 200 )); then size=size/M
          elif (( counted <= 400 )); then size=size/L
          else size=size/XL
          fi
          echo "Size: $counted changed lines counted, $skipped skipped. Label $size."
          if [[ "$size" == size/L || "$size" == size/XL ]]; then
            printf '::warning title=pr-check::%s\n' "This pull request is $size: $counted changed lines, over the 200-line budget. That is fine if the description says why. Otherwise consider splitting it."
          fi
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "size=$size" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '### Size: %s\n\n%s changed lines counted, %s skipped by %s.\n' \
              "$size" "$counted" "$skipped" "$SIZE_IGNORE_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Risk tier: report only, never sets fail. The first rule that
          # applies decides.
          changed="$(grep -v '^$' "$FILES_FILE" || true)"
          risk_scratch="$(mktemp -d)"
          git init -q "$risk_scratch"
          printf '%s\n' 'Migrations/' > "$risk_scratch/migrations"
          migrations="$(printf '%s\n' "$changed" | git -C "$risk_scratch" \
            -c core.excludesFile="$risk_scratch/migrations" check-ignore --no-index --stdin || true)"
          # Major bumps: compare the major version of each package (and the
          # SDK) between the patch's removed and added lines.
          majors=""
          deps_known=false
          if [[ -s "${DEPS_FILE:-}" ]]; then
            deps_known=true
            majors="$(awk '
              /^(\+\+\+|---)/ { next }
              /^[-+]/ {
                sign = substr($0, 1, 1); name = ""; ver = ""
                if (match($0, /Include="[^"]+"/)) name = substr($0, RSTART + 9, RLENGTH - 10)
                if (match($0, /Version="[^"]+"/)) ver = substr($0, RSTART + 9, RLENGTH - 10)
                if (name == "" && match($0, /"version"[[:space:]]*:[[:space:]]*"[^"]+"/)) {
                  v = substr($0, RSTART, RLENGTH); sub(/.*:[[:space:]]*"/, "", v); sub(/"$/, "", v)
                  name = "dotnet-sdk"; ver = v
                }
                if (name != "" && ver != "") {
                  split(ver, part, "."); major = part[1] + 0
                  if (sign == "-") old[name] = major; else new[name] = major
                }
              }
              END { for (n in new) if ((n in old) && new[n] > old[n]) printf "%s %d to %d\n", n, old[n], new[n] }
            ' "$DEPS_FILE")"
          fi
          only() { # only <extended regex>: every changed path matches it
            [[ -n "$changed" ]] && ! printf '%s\n' "$changed" | grep -Evq "$1"
          }
          small=false
          [[ "$size" == size/S || "$size" == size/M ]] && small=true
          if [[ "$sensitive" == true ]]; then
            risk=high; rule="touches a security-sensitive path"
          elif [[ -n "$migrations" ]]; then
            risk=high; rule="touches a migration: $(head -1 <<<"$migrations")"
          elif [[ -n "$majors" ]]; then
            risk=high; rule="major version bump: $(head -1 <<<"$majors")"
          elif $many_files; then
            risk=high; rule="changes $changed_count files, over $WARN_FILES"
          elif $small && only '(\.md$|^docs/)'; then
            risk=low; rule="is documentation only, $size"
          elif $small && [[ "$AUTHOR" == "renovate[bot]" ]] && $deps_known \
               && only '(^|/)(Directory\.Packages\.props|packages\.lock\.json|global\.json|dotnet-tools\.json)$'; then
            risk=low; rule="is a Renovate patch or minor update of dependency files, $size"
          else
            risk=medium; rule="matches no high or low rule"
          fi
          echo "Risk: $risk, because the pull request $rule."
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "risk=risk/$risk" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '\n### Risk: %s\n\nDecided by: %s. Report only (docs/engineering.md section 7.3).\n' \
              "$risk" "$rule" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The template's Checks section, for everyone except the listed
          # dependency bots. An unlisted bot, such as an agent's app, is
          # checked in full.
          if [[ " ${EXEMPT_AUTHORS-renovate[bot] dependabot[bot]} " == *" $AUTHOR "* ]]; then
            echo "Exempt author $AUTHOR: Checks, provenance and issue rules skipped."
            exit "$fail"
          fi
          body="${BODY//$'\r'/}"

          # Workflow changes need the approval label on an issue the PR closes
          # or is part of. A file counts by its new and its old name.
          if [[ -n "${APPROVAL_LABEL:-}" ]] && grep -q '^\.github/workflows/' "$FILES_FILE"; then
            approved="$(awk -F'\t' -v want="$APPROVAL_LABEL" '
              { n = split($2, label, ","); for (i = 1; i <= n; i++) if (label[i] == want) print "#" $1 }' \
              "$ISSUE_LABELS_FILE")"
            if [[ -n "$approved" ]]; then
              ok "workflow change approved by $(paste -sd, - <<<"$approved" | sed 's/,/, /g')"
            else
              err "This pull request changes .github/workflows/, but no issue it closes or is part of carries '$APPROVAL_LABEL'. Ask for the label on the issue, then edit the description to re-run this check."
            fi
          fi

          # Follow-ups and open questions: one section, every item linked to
          # an issue, a memory entry this PR adds, or work for the coordinator
          # to raise. HTML comments (the template's hints) don't count.
          if [[ -n "${FOLLOWUPS_SECTION:-}" ]]; then
            heading="## $FOLLOWUPS_SECTION"
            fu_body="$(printf '%s\n' "$body" | perl -0pe 's/<!--.*?-->//gs' | sed 's/[[:space:]]*$//')"
            if ! grep -qxF -- "$heading" <<<"$fu_body"; then
              err "The description has no '$heading' section. Add it: 'None', or one bullet per follow-up or open question, each ending in #N, memory: <entry id> or raise: <intent>."
            else
              items="$(awk -v h="$heading" '/^## /{ on = ($0 == h); next } on && NF' <<<"$fu_body")"
              fu_bad=0 raises=0 listed=" "
              if [[ -z "$items" ]]; then
                err "The '$heading' section is empty. Write 'None', or list each follow-up and open question."
                fu_bad=1
              elif [[ "$(tr '[:upper:]' '[:lower:]' <<<"$items" | sed -E 's/^[[:space:]]*([-*][[:space:]]+)?//; s/[.[:space:]]*$//')" == none ]]; then
                ok "no follow-ups or open questions"
              else
                while IFS= read -r line; do
                  if [[ ! "$line" =~ ^[[:space:]]*[-*][[:space:]] ]]; then
                    err "In '$heading', '$line' isn't a bullet. List each item as '- ... #N', '- ... memory: <id>' or '- ... raise: <intent>'."
                    fu_bad=1
                  elif [[ "$line" =~ memory:[[:space:]]*([A-Za-z0-9._-]+) ]]; then
                    id="${BASH_REMATCH[1]}" found=false
                    listed+="$id "
                    # || [[ -n "$f" ]] keeps a last line that has no newline.
                    while IFS= read -r f || [[ -n "$f" ]]; do
                      [[ "$f" == "${MEMORY_DIR%/}/"*/"$id.md" ]] && found=true
                    done < "${ADDED_FILE:-/dev/null}"
                    if ! $found; then
                      err "'$heading' links memory: $id, but this pull request adds no entry with that id under ${MEMORY_DIR%/}/."
                      fu_bad=1
                    fi
                  elif [[ "$line" =~ raise:[[:space:]]*[^[:space:]] ]]; then
                    raises=$((raises + 1))
                  elif [[ ! "$line" =~ (^|[^[:alnum:]_])([[:alnum:]._-]+/[[:alnum:]._-]+)?#[0-9]+ ]]; then
                    err "In '$heading', '$line' links nothing. End it with #N, memory: <entry id> or raise: <intent>."
                    fu_bad=1
                  fi
                done <<<"$items"
                if (( raises )); then
                  printf '::warning title=pr-check::%s\n' "'$heading' has $raises raise: item(s) with no issue yet. The coordinator turns each into an issue and edits the line to #N."
                fi
                (( fu_bad )) || ok "every follow-up and open question is linked"
              fi
              # The other direction: every memory entry the PR adds is listed,
              # so each one reaches the owner's review by name.
              unlisted=()
              while IFS= read -r f || [[ -n "$f" ]]; do
                [[ "$f" == "${MEMORY_DIR%/}/"*/*.md && "${f#"${MEMORY_DIR%/}/"*/}" != */* ]] || continue
                id="${f##*/}" && id="${id%.md}"
                [[ "$listed" == *" $id "* ]] || unlisted+=("$id")
              done < "${ADDED_FILE:-/dev/null}"
              for id in "${unlisted[@]}"; do
                err "This pull request adds the memory entry $id, but '$heading' doesn't list it. Add a bullet ending in memory: $id."
              done
            fi
          fi

          # Review leftovers: each review finding left unfixed with its reason,
          # or "None". Enforced out of draft or once labelled reviewed; a
          # draft without the label gets warnings. Unset DRAFT counts as out
          # of draft, so the rule fails closed. HTML comments don't count.
          if [[ -n "${LEFTOVERS_SECTION:-}" ]]; then
            lo_heading="## $LEFTOVERS_SECTION"
            lo_enforce=true lo_when="out of draft"
            if [[ "${DRAFT:-false}" == true ]]; then
              if jq -e 'any(.[]; . == "reviewed")' <<<"${LABELS:-[]}" > /dev/null; then
                lo_when="labelled reviewed"
              else
                lo_enforce=false lo_when="a draft, so a warning until it leaves draft"
              fi
            fi
            lo_report() {
              if $lo_enforce; then err "$1"; else printf '::warning title=pr-check::%s\n' "$1"; fi
            }
            lo_fill="Write 'None', or each review finding left unfixed with its reason."
            lo_body="$(printf '%s\n' "$body" | perl -0pe 's/<!--.*?-->//gs' | sed 's/[[:space:]]*$//')"
            lo_items="$(awk -v h="$lo_heading" '/^## /{ on = ($0 == h); next } on && NF' <<<"$lo_body")"
            lo_placeholder="$(sed -E 's/^[[:space:]]*([-*][[:space:]]+)?//' <<<"$lo_items" \
              | grep -E -m1 -e '^[^[:alnum:]]*[[:upper:]][[:upper:][:digit:]_]+[^[:alnum:]]*$' \
                  -e '^([Tt][Oo][Dd][Oo]|[Tt][Bb][Dd])([^[:alnum:]]|$)' || true)"
            if ! grep -qxF -- "$lo_heading" <<<"$lo_body"; then
              lo_report "The description has no '$lo_heading' section ($lo_when). Add it. $lo_fill"
            elif [[ -z "$lo_items" ]]; then
              lo_report "The '$lo_heading' section is empty ($lo_when). $lo_fill"
            elif [[ "$(tr '[:upper:]' '[:lower:]' <<<"$lo_items" | sed -E 's/^[[:space:]]*([-*][[:space:]]+)?//; s/[.[:space:]]*$//')" == none ]]; then
              ok "no review leftovers"
            elif [[ -n "$lo_placeholder" ]]; then
              lo_report "The '$lo_heading' section still holds the placeholder '$lo_placeholder' ($lo_when). $lo_fill"
            else
              ok "review leftovers listed"
            fi
          fi

          # An issue reference, so the PR shows under the issue's Development
          # section. A warning, never a failure. HTML comments (the
          # template's hints) are stripped first, so their examples never count.
          visible="$(printf '%s\n' "$body" | perl -0pe 's/<!--.*?-->//gs')"
          kw='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+'
          repo_ref='([[:alnum:]._-]+/[[:alnum:]._-]+)?#[0-9]+'
          issue_url='https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+'
          if printf '%s\n' "$visible" | grep -Eiq \
               -e "(^|[^[:alnum:]_])$kw($repo_ref|$issue_url)" \
               -e "(^|[^[:alnum:]_])part of[[:space:]]+($repo_ref|$issue_url)" \
               -e '^[[:space:]]*no issue:[[:space:]]*[^[:space:]]'; then
            ok "an issue is referenced, or the PR says why there is none"
          else
            printf '::warning title=pr-check::%s\n' "No issue referenced. Start the description with 'Closes #N' (links the PR under the issue's Development section and closes it on merge), 'Part of #N', or 'No issue: <reason>'."
          fi

          checks="$(printf '%s\n' "$body" | awk '/^## /{ on = ($0 ~ /^## Checks[[:space:]]*$/); next } on')"
          if [[ -z "$checks" ]]; then
            err "The description has no '## Checks' section. Use the pull request template."
            exit "$fail"
          fi

          # An unticked box needs a reason: a non-blank line that is not itself a box.
          unexplained="$(printf '%s\n' "$checks" | awk '
            {
              if (pending != "") {
                if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*[-*] \[[ xX]\]/) print pending
                pending = ""
              }
              if ($0 ~ /^[[:space:]]*[-*] \[ \]/) pending = $0
            }
            END { if (pending != "") print pending }')"
          if [[ -n "$unexplained" ]]; then
            while IFS= read -r box; do
              err "Unticked with no reason on the next line: ${box#*] }"
            done <<< "$unexplained"
          else
            ok "every unticked box has a reason"
          fi

          ticked() { printf '%s\n' "$checks" | grep -Eq "^[[:space:]]*[-*] \[[xX]\] .*$1"; }

          generated=false
          if grep -Eqi 'co-authored-by:.*noreply@anthropic\.com' "$COMMITS_FILE" \
            || printf '%s\n' "$body" | grep -qi 'generated with'; then
            generated=true
          fi
          if [[ "$generated" == true ]] && ! ticked 'Generated content declared'; then
            err "This pull request shows generated content, but the 'Generated content declared' box is not ticked."
          fi
          if [[ "$sensitive" == true ]] && ! ticked 'security-sensitive path'; then
            err "This pull request touches a security-sensitive path. Explain what could leak or fail open, and tick the box."
          fi
          exit "$fail"

      - name: Set the security-sensitive label
        if: ${{ !cancelled() && steps.check.outputs.sensitive != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SENSITIVE: ${{ steps.check.outputs.sensitive }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. security-sensitive=$SENSITIVE"
            exit 0
          fi
          if [[ "$SENSITIVE" == true ]]; then
            gh api "repos/$REPO/labels/security-sensitive" > /dev/null 2>&1 \
              || gh api "repos/$REPO/labels" -f name=security-sensitive -f color=b60205 \
                   -f description="Touches a path listed as security-sensitive" > /dev/null
            gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=security-sensitive" > /dev/null
            echo "Label added."
          else
            # 404 when the label is not on the pull request, which is fine.
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/security-sensitive" > /dev/null 2>&1 || true
            echo "Label absent."
          fi

      - name: Set the size label
        if: ${{ !cancelled() && steps.check.outputs.size != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SIZE: ${{ steps.check.outputs.size }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. $SIZE"
            exit 0
          fi
          declare -A colour=([size/S]=0e8a16 [size/M]=fbca04 [size/L]=d93f0b [size/XL]=b60205)
          for label in size/S size/M size/L size/XL; do
            if [[ "$label" == "$SIZE" ]]; then
              gh api "repos/$REPO/labels/${label/\//%2F}" > /dev/null 2>&1 \
                || gh api "repos/$REPO/labels" -f name="$label" -f color="${colour[$label]}" \
                     -f description="Changed lines, see docs/engineering.md section 7.1" > /dev/null
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null
            else
              # 404 when the label is not on the pull request, which is fine.
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/${label/\//%2F}" > /dev/null 2>&1 || true
            fi
          done
          echo "Label $SIZE set."

      - name: Set the risk label
        if: ${{ !cancelled() && steps.check.outputs.risk != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          RISK: ${{ steps.check.outputs.risk }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. $RISK"
            exit 0
          fi
          declare -A colour=([risk/high]=b60205 [risk/medium]=fbca04 [risk/low]=0e8a16)
          for label in risk/high risk/medium risk/low; do
            if [[ "$label" == "$RISK" ]]; then
              gh api "repos/$REPO/labels/${label/\//%2F}" > /dev/null 2>&1 \
                || gh api "repos/$REPO/labels" -f name="$label" -f color="${colour[$label]}" \
                     -f description="Computed by pr-check, never set by hand (docs/engineering.md section 7.3)" > /dev/null
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null
            else
              # 404 when the label is not on the pull request, which is fine.
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/${label/\//%2F}" > /dev/null 2>&1 || true
            fi
          done
          echo "Label $RISK set."
