# pr-check.yml: a reusable workflow that checks a pull request's title and
# description, and labels changes to security-sensitive paths. A repository
# adopts it with a caller workflow on pull_request_target; see README.md.
#
# It fails a pull request when:
#   - the title is not a Conventional Commit, type(scope): description, or
#     runs over 72 characters;
#   - the description has no "## Checks" section, or a box in it is
#     unticked with no reason on the line below it;
#   - it shows generated content (a commit co-authored by
#     noreply@anthropic.com, or a "Generated with" line in the description)
#     and the "Generated content declared" box is unticked;
#   - it touches a security-sensitive path and the "security-sensitive path"
#     box is unticked.
# It reports size, never failing because of it: added plus deleted lines
# from the PR files API, skipping paths in the caller's size-ignore-file
# (gitignore syntax, read from the base branch). It sets one label, size/S
# (up to 100), size/M (up to 400), size/L (up to 800) or size/XL, writes the
# count to the job summary, and warns at L and XL. The count matches the
# caller's own scripts/pr-size.sh where it has one: the files API diffs
# against the merge base, follows renames and gives binary files 0 lines.
#
# It computes a risk tier, never failing because of it, for the trial in
# arapsys/redd docs/engineering.md section 7.3. The first rule that applies
# decides, and the job summary names it:
#   high    touches a security-sensitive path; touches a Migrations/ folder;
#           or bumps a major version in Directory.Packages.props or the SDK
#           in global.json (read from the files API's patch, as data);
#   low     documentation only (*.md or docs/), size S or M; or a
#           renovate[bot] update of dependency files only, with no major
#           bump in a readable patch, size S or M;
#   medium  everything else.
# It sets one label, risk/high, risk/medium or risk/low. Callers that also
# trigger on labeled and unlabeled get any hand-made change put back: label
# changes by this workflow's token don't start new runs.
#
# It warns, without failing, when the description references no issue:
# no closing keyword (close, fix or resolve with #N, owner/repo#N or an
# issue URL), no "Part of #N" and no "No issue: <reason>" line. A closing
# keyword is what lists the PR under the issue's Development section.
#
# A dependency bot listed in the exempt-authors input (by default
# renovate[bot] and dependabot[bot]) skips the Checks, provenance and issue
# rules, which ask about a template it does not fill in. Its title is still
# checked. Every other author, including any other bot such as an agent's
# GitHub App, is checked in full: an agent's pull request is the one that
# most needs its Checks section.
#
# Security-sensitive paths are listed in gitignore syntax in the calling
# repository's paths-file, read from the base branch, so a pull request
# cannot unprotect itself. A pull request that touches one, by a file's new
# or old name, gets the security-sensitive label, and loses it on a later
# push that no longer does. With no paths-file there is no label.
#
# Nothing from the pull request's head is checked out or run: its title,
# body, commit messages and file names are read as data. PR fields reach
# scripts through env only, never through ${{ }} inside a script. The check
# step is pure (files and env in, verdict out) so tests/pr-check.test.sh
# can extract and run it. The steps before and after it make every API call.
#
# Written for arapsys. It deliberately leaves out the PAP rules in
# blairforce1/.github's pr-checks (Change:, Record:, class:*, Approved-by:,
# risk labels) and borrows only its pull_request_target pattern.

name: pr-check

on:
  workflow_call:
    inputs:
      paths-file:
        description: Security-sensitive path list, gitignore syntax, read from the base branch.
        type: string
        default: .github/security-sensitive-paths
      exempt-authors:
        description: Space-separated logins that skip the template rules (Checks, provenance, issue). Dependency bots only; never an agent's app.
        type: string
        default: renovate[bot] dependabot[bot]
      size-ignore-file:
        description: Paths that don't count toward the size label, gitignore syntax, read from the base branch.
        type: string
        default: .github/pr-size-ignore

# pull-requests: write is for the security-sensitive, size and risk labels
# and nothing else.
# On a pull request from a fork the token stays read-only and the label
# step warns instead.
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the path lists from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.paths-file }}
            ${{ inputs.size-ignore-file }}
          sparse-checkout-cone-mode: false

      - name: Read the pull request's commits and files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[].commit.message' > "$RUNNER_TEMP/commits.txt"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          # One line per file, under its new name: additions, deletions, path.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | "\(.additions)\t\(.deletions)\t\(.filename)"' > "$RUNNER_TEMP/sizes.tsv"
          # The patches of the files that hold dependency versions, for the
          # major-bump rule. A file whose patch GitHub omits adds nothing.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | select(.filename | test("(^|/)(Directory\\.Packages\\.props|global\\.json)$")) | .patch // empty' \
            > "$RUNNER_TEMP/deps.patch"

      - name: Check
        id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
          COMMITS_FILE: ${{ runner.temp }}/commits.txt
          FILES_FILE: ${{ runner.temp }}/files.txt
          PATHS_FILE: ${{ inputs.paths-file }}
          SIZE_FILE: ${{ runner.temp }}/sizes.tsv
          SIZE_IGNORE_FILE: ${{ inputs.size-ignore-file }}
          DEPS_FILE: ${{ runner.temp }}/deps.patch
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          err() { printf '::error title=pr-check::%s\n' "$1"; fail=1; }
          ok() { printf 'ok    %s\n' "$1"; }

          # Title.
          types='feat|fix|docs|style|refactor|perf|test|build|ci|cli|chore|revert'
          re="^($types)(\([a-z0-9._/,-]+\))?!?: [^[:space:]]"
          if [[ "$TITLE" =~ $re ]]; then
            ok "title is a Conventional Commit"
          else
            err "The title is not a Conventional Commit: type(scope): description, with a type from: ${types//|/, }."
          fi
          if (( ${#TITLE} > 72 )); then
            err "The title is ${#TITLE} characters long. Keep it to 72."
          fi

          # Security-sensitive paths, matched with git's own gitignore rules.
          sensitive=false
          if [[ -f "$PATHS_FILE" ]]; then
            scratch="$(mktemp -d)"
            git init -q "$scratch"
            matches="$(git -C "$scratch" -c core.excludesFile="$(realpath "$PATHS_FILE")" \
              check-ignore --no-index --stdin < "$FILES_FILE" || true)"
            if [[ -n "$matches" ]]; then
              sensitive=true
              printf 'Security-sensitive paths touched:\n%s\n' "$matches"
            else
              ok "no security-sensitive path touched"
            fi
          else
            echo "No $PATHS_FILE on the base branch, so no path counts as security-sensitive."
          fi
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          fi

          # Size: report only, never sets fail. Bots get a size too.
          counted=0 skipped=0
          ignored=""
          if [[ -f "$SIZE_IGNORE_FILE" ]]; then
            sizes_scratch="$(mktemp -d)"
            git init -q "$sizes_scratch"
            ignored="$(cut -f3 "$SIZE_FILE" | git -C "$sizes_scratch" \
              -c core.excludesFile="$(realpath "$SIZE_IGNORE_FILE")" \
              check-ignore --no-index --stdin || true)"
          fi
          # || [[ -n "$path" ]] keeps a last line that has no newline.
          while IFS=$'\t' read -r added deleted path || [[ -n "${path:-}" ]]; do
            [[ -n "$path" ]] || continue
            lines=$(( added + deleted ))
            if [[ -n "$ignored" ]] && grep -qxF -- "$path" <<<"$ignored"; then
              skipped=$(( skipped + lines ))
            else
              counted=$(( counted + lines ))
            fi
          done < "$SIZE_FILE"
          if   (( counted <= 100 )); then size=size/S
          elif (( counted <= 400 )); then size=size/M
          elif (( counted <= 800 )); then size=size/L
          else size=size/XL
          fi
          echo "Size: $counted changed lines counted, $skipped skipped. Label $size."
          if [[ "$size" == size/L || "$size" == size/XL ]]; then
            printf '::warning title=pr-check::%s\n' "This pull request is $size: $counted changed lines, over the 400-line budget. That is fine if the description says why. Otherwise consider splitting it."
          fi
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "size=$size" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '### Size: %s\n\n%s changed lines counted, %s skipped by %s.\n' \
              "$size" "$counted" "$skipped" "$SIZE_IGNORE_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Risk tier: report only, never sets fail. The first rule that
          # applies decides.
          changed="$(grep -v '^$' "$FILES_FILE" || true)"
          risk_scratch="$(mktemp -d)"
          git init -q "$risk_scratch"
          printf '%s\n' 'Migrations/' > "$risk_scratch/migrations"
          migrations="$(printf '%s\n' "$changed" | git -C "$risk_scratch" \
            -c core.excludesFile="$risk_scratch/migrations" check-ignore --no-index --stdin || true)"
          # Major bumps: compare the major version of each package (and the
          # SDK) between the patch's removed and added lines.
          majors=""
          deps_known=false
          if [[ -s "${DEPS_FILE:-}" ]]; then
            deps_known=true
            majors="$(awk '
              /^(\+\+\+|---)/ { next }
              /^[-+]/ {
                sign = substr($0, 1, 1); name = ""; ver = ""
                if (match($0, /Include="[^"]+"/)) name = substr($0, RSTART + 9, RLENGTH - 10)
                if (match($0, /Version="[^"]+"/)) ver = substr($0, RSTART + 9, RLENGTH - 10)
                if (name == "" && match($0, /"version"[[:space:]]*:[[:space:]]*"[^"]+"/)) {
                  v = substr($0, RSTART, RLENGTH); sub(/.*:[[:space:]]*"/, "", v); sub(/"$/, "", v)
                  name = "dotnet-sdk"; ver = v
                }
                if (name != "" && ver != "") {
                  split(ver, part, "."); major = part[1] + 0
                  if (sign == "-") old[name] = major; else new[name] = major
                }
              }
              END { for (n in new) if ((n in old) && new[n] > old[n]) printf "%s %d to %d\n", n, old[n], new[n] }
            ' "$DEPS_FILE")"
          fi
          only() { # only <extended regex>: every changed path matches it
            [[ -n "$changed" ]] && ! printf '%s\n' "$changed" | grep -Evq "$1"
          }
          small=false
          [[ "$size" == size/S || "$size" == size/M ]] && small=true
          if [[ "$sensitive" == true ]]; then
            risk=high; rule="touches a security-sensitive path"
          elif [[ -n "$migrations" ]]; then
            risk=high; rule="touches a migration: $(head -1 <<<"$migrations")"
          elif [[ -n "$majors" ]]; then
            risk=high; rule="major version bump: $(head -1 <<<"$majors")"
          elif $small && only '(\.md$|^docs/)'; then
            risk=low; rule="is documentation only, $size"
          elif $small && [[ "$AUTHOR" == "renovate[bot]" ]] && $deps_known \
               && only '(^|/)(Directory\.Packages\.props|packages\.lock\.json|global\.json|dotnet-tools\.json)$'; then
            risk=low; rule="is a Renovate patch or minor update of dependency files, $size"
          else
            risk=medium; rule="matches no high or low rule"
          fi
          echo "Risk: $risk, because the pull request $rule."
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "risk=risk/$risk" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '\n### Risk: %s\n\nDecided by: %s. Report only (docs/engineering.md section 7.3).\n' \
              "$risk" "$rule" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The template's Checks section, for everyone except the listed
          # dependency bots. An unlisted bot, such as an agent's app, is
          # checked in full.
          if [[ " ${EXEMPT_AUTHORS-renovate[bot] dependabot[bot]} " == *" $AUTHOR "* ]]; then
            echo "Exempt author $AUTHOR: Checks, provenance and issue rules skipped."
            exit "$fail"
          fi
          body="${BODY//$'\r'/}"

          # An issue reference, so the PR shows under the issue's Development
          # section. A warning, never a failure. HTML comments (the
          # template's hints) are stripped first, so their examples never count.
          visible="$(printf '%s\n' "$body" | perl -0pe 's/<!--.*?-->//gs')"
          kw='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+'
          repo_ref='([[:alnum:]._-]+/[[:alnum:]._-]+)?#[0-9]+'
          issue_url='https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+'
          if printf '%s\n' "$visible" | grep -Eiq \
               -e "(^|[^[:alnum:]_])$kw($repo_ref|$issue_url)" \
               -e "(^|[^[:alnum:]_])part of[[:space:]]+($repo_ref|$issue_url)" \
               -e '^[[:space:]]*no issue:[[:space:]]*[^[:space:]]'; then
            ok "an issue is referenced, or the PR says why there is none"
          else
            printf '::warning title=pr-check::%s\n' "No issue referenced. Start the description with 'Closes #N' (links the PR under the issue's Development section and closes it on merge), 'Part of #N', or 'No issue: <reason>'."
          fi

          checks="$(printf '%s\n' "$body" | awk '/^## /{ on = ($0 ~ /^## Checks[[:space:]]*$/); next } on')"
          if [[ -z "$checks" ]]; then
            err "The description has no '## Checks' section. Use the pull request template."
            exit "$fail"
          fi

          # An unticked box needs a reason: a non-blank line that is not itself a box.
          unexplained="$(printf '%s\n' "$checks" | awk '
            {
              if (pending != "") {
                if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*[-*] \[[ xX]\]/) print pending
                pending = ""
              }
              if ($0 ~ /^[[:space:]]*[-*] \[ \]/) pending = $0
            }
            END { if (pending != "") print pending }')"
          if [[ -n "$unexplained" ]]; then
            while IFS= read -r box; do
              err "Unticked with no reason on the next line: ${box#*] }"
            done <<< "$unexplained"
          else
            ok "every unticked box has a reason"
          fi

          ticked() { printf '%s\n' "$checks" | grep -Eq "^[[:space:]]*[-*] \[[xX]\] .*$1"; }

          generated=false
          if grep -Eqi 'co-authored-by:.*noreply@anthropic\.com' "$COMMITS_FILE" \
            || printf '%s\n' "$body" | grep -qi 'generated with'; then
            generated=true
          fi
          if [[ "$generated" == true ]] && ! ticked 'Generated content declared'; then
            err "This pull request shows generated content, but the 'Generated content declared' box is not ticked."
          fi
          if [[ "$sensitive" == true ]] && ! ticked 'security-sensitive path'; then
            err "This pull request touches a security-sensitive path. Explain what could leak or fail open, and tick the box."
          fi
          exit "$fail"

      - name: Set the security-sensitive label
        if: ${{ !cancelled() && steps.check.outputs.sensitive != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SENSITIVE: ${{ steps.check.outputs.sensitive }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. security-sensitive=$SENSITIVE"
            exit 0
          fi
          if [[ "$SENSITIVE" == true ]]; then
            gh api "repos/$REPO/labels/security-sensitive" > /dev/null 2>&1 \
              || gh api "repos/$REPO/labels" -f name=security-sensitive -f color=b60205 \
                   -f description="Touches a path listed as security-sensitive" > /dev/null
            gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=security-sensitive" > /dev/null
            echo "Label added."
          else
            # 404 when the label is not on the pull request, which is fine.
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/security-sensitive" > /dev/null 2>&1 || true
            echo "Label absent."
          fi

      - name: Set the size label
        if: ${{ !cancelled() && steps.check.outputs.size != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SIZE: ${{ steps.check.outputs.size }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. $SIZE"
            exit 0
          fi
          declare -A colour=([size/S]=0e8a16 [size/M]=fbca04 [size/L]=d93f0b [size/XL]=b60205)
          for label in size/S size/M size/L size/XL; do
            if [[ "$label" == "$SIZE" ]]; then
              gh api "repos/$REPO/labels/${label/\//%2F}" > /dev/null 2>&1 \
                || gh api "repos/$REPO/labels" -f name="$label" -f color="${colour[$label]}" \
                     -f description="Changed lines, see docs/engineering.md section 7.1" > /dev/null
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null
            else
              # 404 when the label is not on the pull request, which is fine.
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/${label/\//%2F}" > /dev/null 2>&1 || true
            fi
          done
          echo "Label $SIZE set."

      - name: Set the risk label
        if: ${{ !cancelled() && steps.check.outputs.risk != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          RISK: ${{ steps.check.outputs.risk }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$FORK" == true ]]; then
            echo "::warning title=pr-check::Pull request from a fork: the token is read-only, so the label is not set. $RISK"
            exit 0
          fi
          declare -A colour=([risk/high]=b60205 [risk/medium]=fbca04 [risk/low]=0e8a16)
          for label in risk/high risk/medium risk/low; do
            if [[ "$label" == "$RISK" ]]; then
              gh api "repos/$REPO/labels/${label/\//%2F}" > /dev/null 2>&1 \
                || gh api "repos/$REPO/labels" -f name="$label" -f color="${colour[$label]}" \
                     -f description="Computed by pr-check, never set by hand (docs/engineering.md section 7.3)" > /dev/null
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null
            else
              # 404 when the label is not on the pull request, which is fine.
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/${label/\//%2F}" > /dev/null 2>&1 || true
            fi
          done
          echo "Label $RISK set."
