name: Task
description: A piece of work for a person or a cloud session
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Describe the work with synthetic or redacted examples only. Never paste real customer, contract or personal data into an issue: issues are emailed in notifications. If real data is exposed, email privacy@arapsys.com instead (see SECURITY.md).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist or be true when this is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Design docs, memory entries, build steps and anything the work depends on.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: |
        The spec: at most five numbered checks, A1 to A5. A sixth means a second issue. Write each as `**A1** (kind) ...` and name one evidence kind: `test`, `run`, `cli`, `scan`, `live`, `doc`, `human` or `after-merge`. A check proved by a test or a run is written given/when/then with one concrete example. A guard also gets a negative twin. The checks are frozen at dispatch.
      placeholder: |
        - [ ] **A1** (test) Given a config file with the key `port` set twice, when `check` runs, then it exits 1 and names `port`.
        - [ ] **A2** (test) Given the same file with `port` set once, when `check` runs, then it exits 0.
        - [ ] **A3** (doc) The README describes the duplicate-key rule.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions this may force
      description: Open questions or proposed decisions this work could settle. Leave blank if none.
  - type: checkboxes
    id: no-customer-data
    attributes:
      label: Confidentiality
      options:
        - label: This issue contains no real customer, contract or personal data.
          required: true
